<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Simulator</title>
    <!-- 1. Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Inter font --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 3. Custom CSS */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevents horizontal scrollbars */
            min-height: 100vh;
        }
        
        /* The container for the spinner items */
        #spinner-track {
            display: flex;
            height: 100%;
            transition: transform 6s cubic-bezier(0.1, 0.6, 0.1, 1);
        }

        /* Each item in the spinner */
        .item-card {
            width: 160px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box; 
            background-color: #2d3748; /* bg-gray-800 */
            border-left: 1px solid #4a5568; /* border-gray-700 */
            border-right: 1px solid #4a5568; /* border-gray-700 */
            user-select: none; 
        }

        .item-card img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Inventory Item Card Styling */
        .item-card-inventory {
            width: 100%;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a202c; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            padding: 8px;
            position: relative;
            cursor: pointer; 
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .item-card-inventory:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }
        .item-card-inventory img {
            width: 80px;
            height: 60px;
        }

        /* The "ticker" that shows where the spinner will land */
        #ticker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #fde047, transparent); /* yellow-400 */
            z-index: 10;
            box-shadow: 0 0 10px #fde047;
        }

        /* Modal styles */
        .modal {
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .modal.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-link.active {
            border-color: #3b82f6; /* blue-500 */
            color: #3b82f6;
        }

        /* Balance Pulse Animation */
        @keyframes balancePulse {
            0% { color: #22c55e; transform: scale(1); }
            50% { color: #4ade80; transform: scale(1.1); }
            100% { color: #22c55e; transform: scale(1); }
        }
        .balance-update {
            animation: balancePulse 0.4s ease-out;
        }
    </style>
</head>

    <!-- Global Navigation -->

        </header>

    <!-- MAIN PAGE CONTAINER -->
    <main class="w-full max-w-6xl">

        <!-- 1. CASE SELECTION PAGE -->
        <div id="case-selection-page" class="page active">
            <h2 class="text-3xl font-bold mb-6 text-center">Select a Case to Open</h2>
            <div id="case-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Case cards will be generated here -->
            </div>
        </div>

        <!-- 2. CASE OPENING PAGE (The Spinner) -->
        <div id="case-opening-page" class="page">
            <div class="flex justify-between items-center mb-6">
                <button id="back-to-cases-btn" class="text-gray-400 hover:text-white flex items-center gap-2 transition">
                    &larr; Back to Cases
                </button>
                <h2 id="current-case-title" class="text-2xl md:text-3xl font-bold text-blue-400 text-center flex-1">
                    Opening Case
                </h2>
                <div class="w-24"></div> <!-- Spacer for centering -->
            </div>

            <div id="spinner-container" class="relative w-full h-44 bg-gray-900 border-4 border-gray-700 rounded-lg overflow-hidden shadow-2xl">
                <div id="ticker"></div>
                <div id="spinner-track"></div>
            </div>

            <div class="mt-8 flex flex-col items-center space-y-3">
                <button id="open-button" class="group relative bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xl font-bold py-4 px-12 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-700 overflow-hidden">
                    <span class="relative z-10" id="open-button-text">Open Case ($2.50)</span>
                    <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                </button>
                <p id="balance-warning" class="text-red-500 font-semibold opacity-0 transition-opacity">Insufficient Funds!</p>
            </div>
        </div>


        <!-- 3. INVENTORY PAGE -->
        <div id="inventory-page" class="page">
            <div class="flex justify-between items-end mb-6 border-b border-gray-700 pb-4">
                <h2 class="text-3xl font-bold">
                    Your Inventory
                </h2>
                <div class="text-gray-400 text-sm">
                    Total Value: <span id="inventory-total-value" class="text-green-400 font-bold">$0.00</span>
                </div>
            </div>
            <div id="inventory-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 p-4 bg-gray-800 rounded-lg shadow-inner min-h-[300px]">
                <!-- Inventory items will be rendered here -->
            </div>
        </div>

    </main>


    <!-- RESULT / INSPECT MODAL -->
    <div id="result-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="relative z-10 bg-gray-800 w-full max-w-sm rounded-xl shadow-2xl border border-gray-600 transform transition-all">
            <h2 id="modal-header-title" class="text-2xl font-bold text-center p-4 bg-gray-700/50 rounded-t-xl border-b border-gray-700">
                Item Details
            </h2>
            
            <div id="modal-content" class="p-6 flex flex-col items-center"></div>
            
            <!-- Modal Actions -->
            <div class="p-4 bg-gray-700/50 rounded-b-xl flex gap-3 justify-center">
                <button id="modal-sell-btn" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex flex-col items-center justify-center leading-none">
                    <span class="text-sm opacity-90 font-medium mb-1">Sell for</span>
                    <span id="modal-sell-price" class="text-lg">$0.00</span>
                </button>
                <button id="modal-close-btn" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Collect
                </button>
            </div>
        </div>
    </div>

                    { name: 'UMP-45 | Bone Pile', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl91bXA0NV9zcF9za3VsbF9kaWFncmFtX2JyYXZvX2xpZ2h0LjUzZjk3N2MyN2I0ZjlkMWIxNWRhODgwOGQ4MGQ4ZDBmYTdiYmI1NjAucG5n/auto/auto/85/notrim/e3ab906cb57684aed3610df7696f1212.webp' },
                    { name: 'SG 553 | Wave Spray', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9zZzU1Nl9zcF9zcHJheV93YXZlc19icmF2b19saWdodC4zMDFjMDg5ZTFhZmZjOTBiZmRjODZkN2Y5ZTEwM2U0OWZmYThlMmI1LnBuZw--/auto/auto/85/notrim/58862d24ee4454d5062be107b8aeb116.webp' },
                    { name: 'Dual Berettas', rarity: 'Restricted', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9lbGl0ZV9jdV9zZWFzb25fZWxpdGVzX2JyYXZvX2xpZ2h0Ljk5MmFhM2VkMDI2NjllZTZkNjJjMzc3ZTU5YmRmZmQ2OWI4ZjE1MGIucG5n/auto/auto/85/notrim/77c547e6567d2b45c4e9b2468a4702a8.webp' },
                ],
            },
        };

        const ITEM_WIDTH_PX = 160;
        const REEL_LENGTH = 100;

        // --- 2. STATE VARIABLES ---
        let inventory = [];
        let balance = 1000.00;
        let currentCaseId = null;
        let currentWinningItem = null; // Store the winner temporarily for modal logic
        
        // --- 3. DOM ELEMENTS ---
        const spinnerContainer = document.getElementById('spinner-container');
        const spinnerTrack = document.getElementById('spinner-track');
        const openButton = document.getElementById('open-button');
        const openButtonText = document.getElementById('open-button-text');
        const balanceWarning = document.getElementById('balance-warning');
        const balanceDisplay = document.getElementById('balance-display');
        const backToCasesBtn = document.getElementById('back-to-cases-btn');
        
        const resultModal = document.getElementById('result-modal');
        const modalHeader = document.getElementById('modal-header-title');
        const modalContent = document.getElementById('modal-content');
        const modalSellBtn = document.getElementById('modal-sell-btn');
        const modalSellPrice = document.getElementById('modal-sell-price');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        
        const inventoryGrid = document.getElementById('inventory-grid');
        const inventoryTotalValue = document.getElementById('inventory-total-value');
        const currentCaseTitle = document.getElementById('current-case-title');
        const caseGrid = document.getElementById('case-grid');
        const navLinks = document.querySelectorAll('.nav-link');
        const pages = document.querySelectorAll('.page');


        // --- 4. ECONOMY LOGIC ---

        function loadBalance() {
            const stored = localStorage.getItem('cs2_balance');
            if (stored) {
                balance = parseFloat(stored);
            } else {
                balance = 50.00; // Default starting money
            }
            updateBalanceDisplay();
        }

        function updateBalance(amount) {
            balance += amount;
            localStorage.setItem('cs2_balance', balance.toFixed(2));
            updateBalanceDisplay();
        }

        function updateBalanceDisplay() {
            balanceDisplay.textContent = `$${balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            // Animation effect
            balanceDisplay.classList.remove('balance-update');
            void balanceDisplay.offsetWidth; // Trigger reflow
            balanceDisplay.classList.add('balance-update');
        }

        function calculateInventoryValue() {
            const total = inventory.reduce((sum, item) => sum + item.value, 0);
            if (inventoryTotalValue) {
                inventoryTotalValue.textContent = `$${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            }
        }

        // --- 5. NAVIGATION LOGIC (SPA) ---
        
        function navigate(pageId) {
            pages.forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === pageId) {
                    link.classList.add('active');
                }
            });
            
            if (pageId === 'inventory-page') {
                renderInventory();
            }
        }

        function selectCase(caseId) {
            currentCaseId = caseId;
            const casePrice = CASES[caseId].price;
            
            currentCaseTitle.textContent = `Opening: ${caseId}`;
            openButtonText.textContent = `Open Case ($${casePrice.toFixed(2)})`;
            
            populateSpinner(pickRandomItem(caseId)); 
            navigate('case-opening-page');
        }

        function renderCaseSelectionPage() {
            if (!caseGrid) return;
            caseGrid.innerHTML = '';

            Object.keys(CASES).forEach(caseId => {
                const caseData = CASES[caseId];
                const card = document.createElement('div');
                
                card.className = 'bg-gray-800 p-6 rounded-lg shadow-xl border-t-4 border-blue-600 transition duration-200 hover:scale-[1.02] cursor-pointer flex flex-col items-center text-center relative overflow-hidden group';
                card.addEventListener('click', () => selectCase(caseId));

                card.innerHTML = `
                    <div class="absolute top-0 right-0 bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-bl-lg z-10">
                        $${caseData.price.toFixed(2)}
                    </div>
                    <img src="${caseData.image}" alt="${caseId}" class="w-32 h-20 object-cover rounded-md mb-4 border border-gray-700 group-hover:rotate-3 transition-transform">
                    <h3 class="text-xl font-bold mb-2 text-gray-100">${caseId}</h3>
                    <p class="text-sm text-gray-400 mb-4">${caseData.description}</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg mt-auto w-full transition-colors">
                        Select
                    </button>
                `;
                caseGrid.appendChild(card);
            });
        }


        // --- 6. INVENTORY LOGIC ---

        function renderInventory() {
            if (!inventoryGrid) return;
            
            inventoryGrid.innerHTML = '';
            calculateInventoryValue();

            if (inventory.length === 0) {
                inventoryGrid.innerHTML = '<p class="text-gray-400 text-center col-span-full py-12 text-lg flex flex-col items-center"><span class="text-4xl mb-2"></span>Inventory Empty</p>';
                return;
            }
            
            // Sort by newness (ID is roughly chronological here due to append) or Value
            // Let's sort by Value descending for better UX
            const sortedInventory = [...inventory].sort((a, b) => b.value - a.value);

            sortedInventory.forEach(item => {
                const color = RARITY_COLORS[item.rarity];
                const itemEl = document.createElement('div');
                itemEl.className = 'item-card-inventory group';
                itemEl.style.borderBottom = `4px solid ${color}`;
                
                itemEl.addEventListener('click', () => showModal(item, 'inventory'));

                const wearAcronym = item.wear ? item.wear.match(/\((.*?)\)/)?.[1] || '' : '';

                itemEl.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/80x60/2d3748/FFF?text=Image'">
                    <p class="text-xs font-semibold mt-2 text-white text-center truncate w-full px-1 group-hover:text-blue-300 transition-colors">${item.name}</p>
                    <p class="text-xs text-green-400 font-bold mt-1">$${item.value.toFixed(2)}</p>
                    <span class="absolute top-1 right-1 text-[10px] font-bold bg-gray-900/70 px-1 rounded-bl-lg text-gray-300">${wearAcronym}</span>
                `;
                inventoryGrid.appendChild(itemEl);
            });
        }

        function loadInventory() {
            const storedInventory = localStorage.getItem('cs2_inventory');
            inventory = storedInventory ? JSON.parse(storedInventory) : [];
            renderInventory();
        }

        function saveItemToInventory(item) {
            item.id = crypto.randomUUID(); // Ensure ID is set
            inventory.push(item);
            localStorage.setItem('cs2_inventory', JSON.stringify(inventory));
        }

        function removeItemFromInventory(itemId) {
            inventory = inventory.filter(i => i.id !== itemId);
            localStorage.setItem('cs2_inventory', JSON.stringify(inventory));
            renderInventory();
        }
        

        // --- 7. SIMULATOR & GENERATION ---

        function generateFloatAndWear() {
            const float = (Math.random() * 0.9999).toFixed(4);
            let wear = '';
            const f = parseFloat(float);
            if (f >= 0.00 && f <= 0.07) wear = 'Factory New (FN)';
            else if (f > 0.07 && f <= 0.15) wear = 'Minimal Wear (MW)';
            else if (f > 0.15 && f <= 0.38) wear = 'Field-Tested (FT)';
            else if (f > 0.38 && f <= 0.45) wear = 'Well-Worn (WW)';
            else wear = 'Battle-Scarred (BS)';
            return { float, wear };
        }

        function generateItemValue(rarity) {
            const range = PRICE_RANGES[rarity] || PRICE_RANGES['Mil-Spec'];
            const min = range.min;
            const max = range.max;
            const value = (Math.random() * (max - min) + min).toFixed(2);
            return parseFloat(value);
        }

        function pickRandomItem(caseId) {
            const itemPool = CASES[caseId]?.items || [];
            if (itemPool.length === 0) return null;

            const roll = Math.random(); 
            let winningRarity = 'Mil-Spec'; 
            for (const weight of RARITY_WEIGHTS) {
                if (roll <= weight.cumulativeWeight) { 
                    winningRarity = weight.rarity;
                    break;
                }
            }

            const potentialItems = itemPool.filter(item => item.rarity === winningRarity);
            const baseItem = potentialItems[Math.floor(Math.random() * potentialItems.length)] || itemPool[0]; // Fallback safety

            const { float, wear } = generateFloatAndWear();

            return {
                ...baseItem,
                value: generateItemValue(baseItem.rarity),
                float: float,
                wear: wear,
                pattern_id: Math.floor(Math.random() * 1000) + 1, 
                case: caseId,
            };
        }

        function createItemElement(item, isLarge = false) {
            const div = document.createElement('div');
            if (!item) return div;
            
            const color = RARITY_COLORS[item.rarity];
            const imageUrl = item.image;
            const placeholderTextSize = isLarge ? '150x100/1f2937/FFFFFF?text=' : '120x80/2d3748/FFFFFF?text=';
            const placeholderName = item.name.split('|')[0].trim();
            const placeholderUrl = `https://placehold.co/${placeholderTextSize}${placeholderName.replace(/ /g, '+')}`;

            if (isLarge) {
                div.className = 'flex flex-col items-center w-full';
                div.style.borderTop = `8px solid ${color}`;
                div.innerHTML = `
                    <img src="${imageUrl}" alt="${item.name}" class="w-full h-48 object-contain bg-gray-900 rounded-md mt-4 shadow-lg" 
                         onerror="this.src='${placeholderUrl.replace('120x80', '150x100')}'">
                    <h3 class="text-2xl font-bold mt-4 text-center leading-tight">${item.name}</h3>
                    <p class="item-card-rarity text-lg mb-2" style="color: ${color};">${item.rarity}</p>
                    
                    <div class="mt-2 text-left w-full p-4 bg-gray-700 rounded-lg text-sm">
                        <div class="flex justify-between items-center mb-2 border-b border-gray-600 pb-2">
                            <span class="text-gray-300">Market Value</span>
                            <span class="text-green-400 font-bold text-lg">$${item.value.toFixed(2)}</span>
                        </div>
                        <p class="flex justify-between"><span class="text-gray-400">Condition:</span> <span class="text-white">${item.wear}</span></p>
                        <p class="flex justify-between"><span class="text-gray-400">Float:</span> <span class="text-gray-300 font-mono">${item.float}</span></p>
                        <p class="flex justify-between"><span class="text-gray-400">Pattern:</span> <span class="text-gray-300">${item.pattern_id}</span></p>
                    </div>
                `;
            } else {
                div.className = 'item-card'; 
                div.style.borderTop = `4px solid ${color}`;
                div.innerHTML = `
                    <img src="${imageUrl}" alt="${item.name}" onerror="this.src='${placeholderUrl}'">
                `;
            }
            return div;
        }

        function populateSpinner(winningItem) {
            if (!currentCaseId || !winningItem) return;
            spinnerTrack.innerHTML = ''; 
            
            const reelItems = [];
            for (let i = 0; i < REEL_LENGTH; i++) {
                reelItems.push(pickRandomItem(currentCaseId));
            }
            reelItems[REEL_LENGTH - 6] = winningItem;
            
            reelItems.forEach(item => {
                spinnerTrack.appendChild(createItemElement(item));
            });
        }

        // --- 8. ACTIONS & ANIMATIONS ---

        function startSpin() {
            if (openButton.disabled || !currentCaseId) return;
            
            const caseCost = CASES[currentCaseId].price;

            // Check Balance
            if (balance < caseCost) {
                balanceWarning.style.opacity = '1';
                setTimeout(() => balanceWarning.style.opacity = '0', 2000);
                return;
            }

            // Deduct Money
            updateBalance(-caseCost);

            // Prepare Spin
            openButton.disabled = true;
            hideModal();
            balanceWarning.style.opacity = '0';

            const winningItem = pickRandomItem(currentCaseId);
            currentWinningItem = winningItem; // Save for modal
            
            populateSpinner(winningItem);

            // Reset Position
            spinnerTrack.style.transition = 'none';
            spinnerTrack.style.transform = 'translateX(0)';

            // Calculate Landing
            const winningItemIndex = REEL_LENGTH - 6;
            const containerWidth = spinnerContainer.clientWidth;
            const targetPosition = (winningItemIndex * ITEM_WIDTH_PX) + (ITEM_WIDTH_PX / 2) - (containerWidth / 2);
            const jitter = (Math.random() - 0.5) * (ITEM_WIDTH_PX * 0.4);
            const finalTranslateX = -(targetPosition + jitter);

            // Trigger Animation
            setTimeout(() => {
                spinnerTrack.style.transition = 'transform 6s cubic-bezier(0.1, 0.6, 0.1, 1)';
                spinnerTrack.style.transform = `translateX(${finalTranslateX}px)`;
            }, 50); 

            // Show Result
            setTimeout(() => {
                showModal(winningItem, 'unbox');
                openButton.disabled = false;
            }, 6100);
        }

        /**
         * Handles Sell Logic
         * @param {Object} item - The item to sell
         * @param {boolean} isInventoryItem - True if item is already in inventory (remove it), False if just unboxed (don't add it)
         */
        function sellItem(item, isInventoryItem) {
            updateBalance(item.value);
            
            if (isInventoryItem) {
                removeItemFromInventory(item.id);
            } else {
                // If unboxed, we simply don't save it.
                // But visuals might be nice.
            }
            
            hideModal();
        }

        /**
         * Handles Keep/Collect Logic
         */
        function keepItem(item) {
            saveItemToInventory(item);
            hideModal();
        }

        // --- 9. MODAL SYSTEM ---

        function showModal(item, type) {
            modalContent.innerHTML = ''; 
            modalContent.appendChild(createItemElement(item, true));
            
            modalSellPrice.textContent = `$${item.value.toFixed(2)}`;

            // Configure Buttons based on context
            if (type === 'unbox') {
                // Unbox Context: "Collect" (Save) or "Sell" (Discard + Money)
                modalHeader.textContent = 'You Unboxed:';
                modalCloseBtn.textContent = 'Collect Item';
                
                // Direct assignment overwrites previous listeners safely
                modalSellBtn.onclick = () => sellItem(item, false);
                modalCloseBtn.onclick = () => keepItem(item);

            } else {
                // Inventory Context: "Close" (Do nothing) or "Sell" (Remove + Money)
                modalHeader.textContent = 'Inspect Item';
                modalCloseBtn.textContent = 'Close';

                // Direct assignment overwrites previous listeners safely
                modalSellBtn.onclick = () => sellItem(item, true);
                modalCloseBtn.onclick = hideModal;
            }

            resultModal.classList.remove('hidden');
            resultModal.classList.add('visible');
        }

        function hideModal() {
            resultModal.classList.add('hidden');
            resultModal.classList.remove('visible');
        }


        // --- 10. INITIALIZATION ---
        
        openButton.addEventListener('click', startSpin);
        backToCasesBtn.addEventListener('click', () => navigate('case-selection-page'));
        
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) hideModal();
        });

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                navigate(e.currentTarget.getAttribute('data-page'));
            });
        });
        
        window.addEventListener('load', () => {
            loadBalance();
            loadInventory();
            renderCaseSelectionPage();
            navigate('case-selection-page'); 
            
            // Preload spinner
            if(Object.keys(CASES).length > 0) {
                // Default select first case without navigating
                currentCaseId = Object.keys(CASES)[0];
                const price = CASES[currentCaseId].price;
                currentCaseTitle.textContent = `Opening: ${currentCaseId}`;
                openButtonText.textContent = `Open Case ($${price.toFixed(2)})`;
                populateSpinner(pickRandomItem(currentCaseId));
            }
        });

    </script>

</body>
</html>
