<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Multi-Case Simulator</title>
    <!-- 1. Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Inter font --><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 3. Custom CSS */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Prevents horizontal scrollbars */
            min-height: 100vh;
        }
        
        /* The container for the spinner items */
        #spinner-track {
            display: flex;
            height: 100%;
            transition: transform 6s cubic-bezier(0.1, 0.6, 0.1, 1);
        }

        /* Each item in the spinner */
        .item-card {
            width: 160px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box; 
            background-color: #2d3748; /* bg-gray-800 */
            border-left: 1px solid #4a5568; /* border-gray-700 */
            border-right: 1px solid #4a5568; /* border-gray-700 */
            user-select: none; 
        }

        .item-card img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Inventory Item Card Styling */
        .item-card-inventory {
            width: 100%;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a202c; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            padding: 8px;
            position: relative;
            cursor: pointer; 
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .item-card-inventory:hover {
            transform: scale(1.03);
            opacity: 0.95;
        }
        .item-card-inventory img {
            width: 80px;
            height: 60px;
        }

        /* The "ticker" that shows where the spinner will land */
        #ticker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #fde047, transparent); /* yellow-400 */
            z-index: 10;
            box-shadow: 0 0 10px #fde047;
        }

        /* Modal styles */
        .modal {
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .modal.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .nav-link.active {
            border-color: #3b82f6; /* blue-500 */
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center p-4">

    <!-- Global Navigation -->
    <div class="w-full max-w-6xl mb-8 border-b border-gray-700">

                CS2 Case Sim

                </button>
            </nav>
        </header>
    </div>

    <!-- MAIN PAGE CONTAINER -->
    <main class="w-full max-w-6xl">

        <!-- 1. CASE SELECTION PAGE -->
        <div id="case-selection-page" class="page active">
            <h2 class="text-3xl font-bold mb-6 text-center">Select a Case to Open</h2>
            <div id="case-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Case cards will be generated here -->
            </div>
        </div>

        <!-- 2. CASE OPENING PAGE (The Spinner) -->
        <div id="case-opening-page" class="page">
            <h2 id="current-case-title" class="text-3xl font-bold mb-6 text-center text-blue-400">
                Opening: Initial Case
            </h2>

            <div id="spinner-container" class="relative w-full h-44 bg-gray-900 border-4 border-gray-700 rounded-lg overflow-hidden shadow-2xl">
                <div id="ticker"></div>
                <div id="spinner-track"></div>
            </div>

            <div class="mt-8 flex justify-center space-x-4">
                <button id="open-button" class="bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold py-4 px-10 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
                    Open Case
                </button>
            </div>
        </div>


        <!-- 3. INVENTORY PAGE -->
        <div id="inventory-page" class="page">
            <h2 class="text-3xl font-bold text-center mb-6">
                Your Inventory
            </h2>
            <div id="inventory-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 p-4 bg-gray-800 rounded-lg shadow-inner">
                <!-- Inventory items will be rendered here -->
            </div>
        </div>

    </main>


    <!-- RESULT MODAL (Reusable) -->
    <div id="result-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="relative z-10 bg-gray-800 w-full max-w-sm rounded-xl shadow-xl border border-gray-700">
            <h2 id="modal-header-title" class="text-3xl font-bold text-center p-6 bg-gray-700/50 rounded-t-xl">
                Unboxed:
            </h2>
            <div id="modal-content" class="p-6 flex flex-col items-center"></div>
            
            <div class="p-6 bg-gray-700/50 rounded-b-xl text-center">
                <!-- Button text changes based on context (Result vs. Inventory View) -->
                <button id="close-modal-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200">
                    Close
                </button>
            </div>
        </div>
    </div>

                    { name: 'M4A1-S | Bright Water', rarity: 'Restricted', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9tNGExX3NpbGVuY2VyX2h5X29jZWFuX2JyYXZvX2xpZ2h0LjBiMmE3NDMyNjE4YzhkOWFlYTlmN2MyY2YxMzc2YzhlMzczZmY4ZDQucG5n/auto/auto/85/notrim/e78c8f48f1351807369ace4998eb6c26.webp' },

                    // Mil-Spec
                    { name: 'Galil AR | Shattered', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9nYWxpbGFyX2h5X2NydW1wbGVfYnJhdm9fbGlnaHQuMjBmYWI1OWFmNjgwYmI2MjAzYjExMTM2NjRlZjA5MTM2MDg1OGEwNC5wbmc-/auto/auto/85/notrim/ad5084005f3c2b31082f2ef2ccbd224c.webp' },
                    { name: 'Nova | Tempest', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9ub3ZhX2h5X3NlYXNpZGVfYnJhdm9fbGlnaHQuNjI1MWIwMDVlYTQ3NWUyMGNkODMyNmRhMTFiYjM0MTZlMzZlYTQ5YS5wbmc-/auto/auto/85/notrim/f9dc64a6822e0b8579af670629d3ab78.webp' },
                    { name: 'UMP-45 | Bone Pile', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl91bXA0NV9zcF9za3VsbF9kaWFncmFtX2JyYXZvX2xpZ2h0LjUzZjk3N2MyN2I0ZjlkMWIxNWRhODgwOGQ4MGQ4ZDBmYTdiYmI1NjAucG5n/auto/auto/85/notrim/e3ab906cb57684aed3610df7696f1212.webp' },
                    { name: 'SG 553 | Wave Spray', rarity: 'Mil-Spec', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9zZzU1Nl9zcF9zcHJheV93YXZlc19icmF2b19saWdodC4zMDFjMDg5ZTFhZmZjOTBiZmRjODZkN2Y5ZTEwM2U0OWZmYThlMmI1LnBuZw--/auto/auto/85/notrim/58862d24ee4454d5062be107b8aeb116.webp' },
                    { name: 'Dual Berettas', rarity: 'Restricted', image: 'https://cdn.csgoskins.gg/public/uih/items/aHR0cHM6Ly9jZG4uY3Nnb3NraW5zLmdnL3B1YmxpYy9pbWFnZXMvYnVja2V0cy9lY29uL2RlZmF1bHRfZ2VuZXJhdGVkL3dlYXBvbl9lbGl0ZV9jdV9zZWFzb25fZWxpdGVzX2JyYXZvX2xpZ2h0Ljk5MmFhM2VkMDI2NjllZTZkNjJjMzc3ZTU5YmRmZmQ2OWI4ZjE1MGIucG5n/auto/auto/85/notrim/77c547e6567d2b45c4e9b2468a4702a8.webp' },
                ],
            },
        };

        // The fixed width of a single item card in pixels
        const ITEM_WIDTH_PX = 160;
        // The number of items to show in the spinner reel
        const REEL_LENGTH = 100;

        // --- 2. STATE VARIABLES ---
        let inventory = [];
        let currentCaseId = null; // Stores the key of the case currently being opened
        
        // --- 3. DOM ELEMENTS ---
        const spinnerContainer = document.getElementById('spinner-container');
        const spinnerTrack = document.getElementById('spinner-track');
        const openButton = document.getElementById('open-button');
        const resultModal = document.getElementById('result-modal');
        const modalHeader = document.getElementById('modal-header-title');
        const modalContent = document.getElementById('modal-content');
        const closeModalButton = document.getElementById('close-modal-button');
        const inventoryGrid = document.getElementById('inventory-grid');
        const currentCaseTitle = document.getElementById('current-case-title');
        const caseGrid = document.getElementById('case-grid');
        const navLinks = document.querySelectorAll('.nav-link');
        const pages = document.querySelectorAll('.page');


        // --- 4. NAVIGATION LOGIC (SPA) ---
        
        /**
         * Navigates between the main application pages.
         * @param {string} pageId - The ID of the page to navigate to (e.g., 'case-selection-page').
         */
        function navigate(pageId) {
            pages.forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === pageId) {
                    link.classList.add('active');
                }
            });
            
            // Re-render inventory when navigating to it
            if (pageId === 'inventory-page') {
                renderInventory();
            }
        }

        /**
         * Sets the current case and moves to the opening page.
         * @param {string} caseId - The ID (key) of the case selected.
         */
        function selectCase(caseId) {
            currentCaseId = caseId;
            currentCaseTitle.textContent = `Opening: ${caseId}`;
            
            // Initialize spinner with a random item from the selected case
            populateSpinner(pickRandomItem(caseId)); 
            
            navigate('case-opening-page');
        }

        /**
         * Generates and displays the cards for all available cases.
         */
        function renderCaseSelectionPage() {
            if (!caseGrid) return;
            caseGrid.innerHTML = '';

            Object.keys(CASES).forEach(caseId => {
                const caseData = CASES[caseId];
                const card = document.createElement('div');
                
                card.className = 'bg-gray-800 p-6 rounded-lg shadow-xl border-t-4 border-blue-600 transition duration-200 hover:scale-[1.02] cursor-pointer flex flex-col items-center text-center';
                
                // Add click listener to select this case
                card.addEventListener('click', () => selectCase(caseId));

                card.innerHTML = `
                    <img src="${caseData.image}" alt="${caseId}" class="w-32 h-20 object-cover rounded-md mb-4 border border-gray-700">
                    <h3 class="text-xl font-bold mb-2 text-gray-100">${caseId}</h3>
                    <p class="text-sm text-gray-400 mb-4">${caseData.description}</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg mt-auto w-full">
                        Select Case
                    </button>
                `;
                caseGrid.appendChild(card);
            });
        }


        // --- 5. INVENTORY LOGIC (localStorage) ---

        /**
         * Renders the current in-memory inventory state to the DOM.
         */
        function renderInventory() {
            if (!inventoryGrid) return;
            
            inventoryGrid.innerHTML = '';
            if (inventory.length === 0) {
                inventoryGrid.innerHTML = '<p class="text-gray-400 text-center col-span-full py-8 text-lg">Your inventory is empty. Open a case to win an item!</p>';
                return;
            }
            
            inventory.forEach(item => {
                const color = RARITY_COLORS[item.rarity];
                const itemEl = document.createElement('div');
                itemEl.className = 'item-card-inventory transition duration-150 hover:scale-[1.02]';
                itemEl.style.borderBottom = `4px solid ${color}`;
                
                // Attach click listener here to open the stats modal
                itemEl.addEventListener('click', () => showInventoryStatsModal(item));

                // Extract Wear Acronym (e.g., FN, MW)
                const wearAcronym = item.wear ? item.wear.match(/\((.*?)\)/)?.[1] || '' : '';

                itemEl.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://placehold.co/80x60/2d3748/FFF?text=Image+Error'">
                    <p class="text-xs font-semibold mt-2 text-white text-center truncate w-full px-1">${item.name}</p>
                    <p class="text-xs text-green-400 font-bold mt-1">$${item.value.toFixed(2)}</p>
                    <span class="absolute top-1 right-1 text-[10px] font-bold bg-gray-900/70 px-1 rounded-bl-lg">${wearAcronym}</span>
                `;
                inventoryGrid.appendChild(itemEl);
            });
        }

        /**
         * Loads the inventory from browser's localStorage.
         */
        function loadInventory() {
            const storedInventory = localStorage.getItem('cs2_inventory');
            inventory = storedInventory ? JSON.parse(storedInventory) : [];
            
            // Sort inventory by rarity (Gold first, then Red, Pink, Purple, Blue)
            inventory.sort((a, b) => {
                const order = ['Rare Special', 'Covert', 'Classified', 'Restricted', 'Mil-Spec'];
                return order.indexOf(a.rarity) - order.indexOf(b.rarity);
            });
            
            renderInventory();
        }

        /**
         * Saves a newly unboxed item to the browser's localStorage and updates the UI.
         * @param {Object} item - The item object to save.
         */
        function saveItemToInventory(item) {
            let currentInventory = JSON.parse(localStorage.getItem('cs2_inventory') || '[]');
            
            currentInventory.push({ 
                id: crypto.randomUUID(), 
                ...item 
            });
            
            localStorage.setItem('cs2_inventory', JSON.stringify(currentInventory));
            
            inventory = currentInventory;
            // No need to re-render, as the user will likely still be on the case page. 
            // The inventory is re-rendered when navigating to the inventory page.
        }
        

        // --- 6. CORE SIMULATOR FUNCTIONS ---

        /**
         * Generates a random float value (wear) and determines the wear category.
         */
        function generateFloatAndWear() {
            const float = (Math.random() * 0.9999).toFixed(4); // 0.0000 to 0.9999
            let wear = '';
            const f = parseFloat(float);

            // CS2 Wear Tiers:
            if (f >= 0.00 && f <= 0.07) wear = 'Factory New (FN)';
            else if (f > 0.07 && f <= 0.15) wear = 'Minimal Wear (MW)';
            else if (f > 0.15 && f <= 0.38) wear = 'Field-Tested (FT)';
            else if (f > 0.38 && f <= 0.45) wear = 'Well-Worn (WW)';
            else wear = 'Battle-Scarred (BS)';

            return { float, wear };
        }

        /**
         * Generates a random value for the item based on its rarity.
         */
        function generateItemValue(rarity) {
            const range = PRICE_RANGES[rarity] || PRICE_RANGES['Mil-Spec'];
            const min = range.min;
            const max = range.max;
            
            const value = (Math.random() * (max - min) + min).toFixed(2);
            return parseFloat(value);
        }

        /**
         * Picks a random item from the *selected* case's item pool.
         * @param {string} caseId - The ID of the case to draw from.
         */
        function pickRandomItem(caseId) {
            const itemPool = CASES[caseId]?.items || [];
            if (itemPool.length === 0) {
                console.error(`Case ID "${caseId}" has no items defined.`);
                return null;
            }

            const roll = Math.random(); 
            let winningRarity = 'Mil-Spec'; 
            
            // 1. Determine Rarity
            for (const weight of RARITY_WEIGHTS) {
                if (roll <= weight.cumulativeWeight) { 
                    winningRarity = weight.rarity;
                    break;
                }
            }

            // 2. Filter item pool
            const potentialItems = itemPool.filter(item => item.rarity === winningRarity);
            
            // 3. Select base item
            const baseItem = potentialItems[Math.floor(Math.random() * potentialItems.length)];

            // 4. Generate unique properties
            const { float, wear } = generateFloatAndWear();

            // 5. Combine and return the fully generated item
            return {
                ...baseItem,
                value: generateItemValue(baseItem.rarity),
                float: float,
                wear: wear,
                pattern_id: Math.floor(Math.random() * 1000) + 1, 
                case: caseId, // Add the case name to the item data
            };
        }

        /**
         * Creates an HTML element for a given item.
         */
        function createItemElement(item, isLarge = false) {
            const div = document.createElement('div');
            if (!item) return div; // Handle null item if case is empty
            
            const color = RARITY_COLORS[item.rarity];
            const imageUrl = item.image;
            
            // Determine the size of the placeholder text based on context
            const placeholderTextSize = isLarge ? '150x100/1f2937/FFFFFF?text=' : '120x80/2d3748/FFFFFF?text=';
            
            // Use the item name for a dynamic placeholder
            const placeholderName = item.name.split('|')[0].trim();
            const placeholderUrl = `https://placehold.co/${placeholderTextSize}${placeholderName.replace(/ /g, '+')}`;


            if (isLarge) {
                // Large card for the result modal
                div.className = 'flex flex-col items-center w-full max-w-xs';
                div.style.borderTop = `8px solid ${color}`;
                div.innerHTML = `
                    <img src="${imageUrl}" alt="${item.name}" class="w-full h-48 object-cover rounded-md mt-4 shadow-lg" 
                         onerror="this.src='${placeholderUrl.replace('120x80', '150x100')}'">
                    <h3 class="text-3xl font-bold mt-4 text-center">${item.name}</h3>
                    <p class="item-card-rarity text-xl" style="color: ${color};">${item.rarity}</p>
                    
                    <div class="mt-4 text-left w-full p-4 bg-gray-700 rounded-lg">
                        <p class="text-lg font-bold">Value: <span class="text-green-400">$${item.value.toFixed(2)}</span></p>
                        <p class="text-sm pt-2">Condition: <span class="text-white font-semibold">${item.wear}</span></p>
                        <p class="text-sm">Float Value: <span class="text-gray-300">${item.float}</span></p>
                        <p class="text-sm">Pattern ID: <span class="text-gray-300">${item.pattern_id}</span></p>
                        <p class="text-sm mt-2 font-semibold">Case: <span class="text-blue-300">${item.case}</span></p>
                    </div>
                `;
            } else {
                // Small card for the spinner track
                div.className = 'item-card'; 
                div.style.borderTop = `4px solid ${color}`;
                div.innerHTML = `
                    <img src="${imageUrl}" alt="${item.name}" 
                         onerror="this.src='${placeholderUrl}'">
                `;
            }
            return div;
        }

        /**
         * Fills the spinner track with items from the current case.
         */
        function populateSpinner(winningItem) {
            if (!currentCaseId || !winningItem) return;

            spinnerTrack.innerHTML = ''; 
            
            const reelItems = [];
            for (let i = 0; i < REEL_LENGTH; i++) {
                // Pick random items from the current case's pool
                const randomItem = pickRandomItem(currentCaseId); 
                if (randomItem) reelItems.push(randomItem);
            }

            // The winner is placed at a position that lands in the middle of the viewport
            reelItems[REEL_LENGTH - 6] = winningItem;
            
            reelItems.forEach(item => {
                spinnerTrack.appendChild(createItemElement(item));
            });
        }

        /**
         * Hides the result modal.
         */
        function hideModal() {
            resultModal.classList.add('hidden');
            resultModal.classList.remove('visible');
        }

        /**
         * The main function to start the spin animation.
         */
        function startSpin() {
            if (openButton.disabled || !currentCaseId) return;
            
            // 1. Disable button and hide modal
            openButton.disabled = true;
            hideModal(); 

            // 2. Pick a winner (Generates all unique properties using the current case)
            const winningItem = pickRandomItem(currentCaseId);
            if (!winningItem) {
                openButton.disabled = false;
                console.error("Could not select winning item.");
                return;
            }
            
            // 3. Populate the spinner with the winner
            populateSpinner(winningItem);

            // 4. Reset spinner position instantly 
            spinnerTrack.style.transition = 'none';
            spinnerTrack.style.transform = 'translateX(0)';

            // 5. Calculate the final position
            const winningItemIndex = REEL_LENGTH - 6;
            const containerWidth = spinnerContainer.clientWidth;
            
            const targetPosition = (winningItemIndex * ITEM_WIDTH_PX) 
                                 + (ITEM_WIDTH_PX / 2) 
                                 - (containerWidth / 2);

            const jitter = (Math.random() - 0.5) * (ITEM_WIDTH_PX * 0.4);
            
            const finalTranslateX = -(targetPosition + jitter);

            // 6. Force browser to apply the reset 
            setTimeout(() => {
                // 7. Apply the CSS transition to animate the spin
                spinnerTrack.style.transition = 'transform 6s cubic-bezier(0.1, 0.6, 0.1, 1)';
                spinnerTrack.style.transform = `translateX(${finalTranslateX}px)`;
            }, 100); 

            // 8. Show the result *after* the animation finishes
            setTimeout(() => {
                showResult(winningItem);
            }, 6100);
        }

        /**
         * Shows the UNBOX RESULT modal.
         */
        function showResult(item) {
            // AUTOMATICALLY ADD TO INVENTORY
            saveItemToInventory(item);
            
            modalHeader.textContent = 'Unboxed:';
            modalContent.innerHTML = ''; 
            modalContent.appendChild(createItemElement(item, true)); 
            
            // Update button text now that save is automatic
            closeModalButton.textContent = 'Close';

            resultModal.classList.remove('hidden');
            resultModal.classList.add('visible');
            openButton.disabled = false;
        }

        /**
         * Shows the INVENTORY STATS modal.
         */
        function showInventoryStatsModal(item) {
            modalHeader.textContent = 'Item Details:';
            modalContent.innerHTML = '';
            modalContent.appendChild(createItemElement(item, true));

            closeModalButton.textContent = 'Close';
            
            resultModal.classList.remove('hidden');
            resultModal.classList.add('visible');
        }

        /**
         * Universal handler for the modal button click (always hides the modal now).
         */
        function handleModalButtonAction() {
            // Only action is to close the modal now
            hideModal();
        }


        // --- 7. EVENT LISTENERS & INITIALIZATION ---
        
        openButton.addEventListener('click', startSpin);
        closeModalButton.addEventListener('click', handleModalButtonAction); 
        
        // Allow modal to be closed by clicking the backdrop/overlay
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) {
                hideModal();
            }
        });

        // Navigation event listeners
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const pageId = e.currentTarget.getAttribute('data-page');
                navigate(pageId);
            });
        });
        
        // Initial setup
        window.addEventListener('load', () => {
            loadInventory();
            renderCaseSelectionPage();
            // Start on the Case Selection Page
            navigate('case-selection-page'); 

            // Default the current case to the first one for immediate opening if user rushes
            currentCaseId = Object.keys(CASES)[0];
            currentCaseTitle.textContent = `Opening: ${currentCaseId}`;
            populateSpinner(pickRandomItem(currentCaseId));
        });

    </script>
